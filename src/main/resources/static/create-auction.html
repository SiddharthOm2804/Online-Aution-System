<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Auction | BidSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <div class="brand-icon"><i class="fas fa-gavel"></i></div>
            <span>BidSphere</span>
        </a>
        <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link" href="auctions.html"><i class="fas fa-fire me-1"></i> Live Auctions</a></li>
                <li class="nav-item"><a class="nav-link active" href="create-auction.html"><i class="fas fa-plus-circle me-1"></i> Create</a></li>
                <li class="nav-item"><a class="nav-link" href="bidding.html"><i class="fas fa-hand-holding-usd me-1"></i> Bid Room</a></li>
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-chart-pie me-1"></i> Analytics</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <button onclick="toggleTheme()" class="theme-toggle-btn me-1" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-status-pill">
                    <i class="fas fa-user-circle text-primary"></i>
                    <span id="userStatusText">Guest</span>
                </div>
                <button id="logoutBtn" onclick="logout()" class="btn btn-sm btn-outline-danger" style="display:none; border-radius: 20px;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
                <a id="loginBtn" href="login.html" class="btn-glow py-2 px-3 text-sm" style="font-size:0.85rem;">Sign In</a>
            </div>
        </div>
    </div>
</nav>
<script src="theme.js"></script>

<div class="container" style="margin-top: 6rem; padding-bottom: 5rem;">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="brand-icon" style="width:48px; height:48px; font-size:1.4rem;">
                        <i class="fas fa-plus"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold text-white mb-0">Create New Auction</h3>
                        <p class="text-secondary small mb-0">List an item for instant competitive bidding across the platform</p>
                    </div>
                </div>

                <form id="createForm" onsubmit="handleCreate(event)">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">AUCTION TITLE</label>
                        <input type="text" id="title" class="form-control" placeholder="e.g. Rare Vintage Chronograph 1974" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">ITEM DESCRIPTION</label>
                        <textarea id="description" class="form-control" rows="4" placeholder="Detail condition, authenticity, provenance, and specifications..." required></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-bold">STARTING PRICE ($)</label>
                            <input type="number" id="startingPrice" class="form-control" placeholder="100.00" min="1" step="0.5" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-bold">END DATE & TIME</label>
                            <input type="datetime-local" id="endDate" class="form-control" required>
                        </div>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn-glow flex-grow-1 justify-content-center py-3">
                            <i class="fas fa-rocket"></i> Launch Auction Listing
                        </button>
                        <a href="auctions.html" class="btn-glow-outline justify-content-center px-4 py-3">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const apiBase = window.location.origin + '/OnlineAuction/api/auction';
    let userId = sessionStorage.getItem('userId');

    function updateNavUser() {
        const userStatusText = document.getElementById('userStatusText');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginBtn = document.getElementById('loginBtn');

        if (userId) {
            userStatusText.textContent = userId;
            logoutBtn.style.display = 'inline-block';
            loginBtn.style.display = 'none';
        } else {
            userStatusText.textContent = 'Guest';
            logoutBtn.style.display = 'none';
            loginBtn.style.display = 'inline-flex';
        }
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'notification-toast';
        toast.innerHTML = `<i class="fas fa-bell text-warning"></i><span>${message}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-10px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // Default end date to 7 days in future
    const now = new Date();
    now.setDate(now.getDate() + 7);
    const isoStr = now.toISOString().slice(0, 16);
    document.getElementById('endDate').value = isoStr;

    async function handleCreate(e) {
        e.preventDefault();
        if (!userId) {
            showToast("Please sign in to list an auction item");
            setTimeout(() => window.location.href = 'login.html', 1500);
            return;
        }

        const payload = {
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            startingPrice: parseFloat(document.getElementById('startingPrice').value),
            endDate: document.getElementById('endDate').value,
            sellerId: userId
        };

        try {
            const res = await fetch(`${apiBase}/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showToast("🎉 Auction successfully listed!");
                setTimeout(() => window.location.href = 'auctions.html', 1500);
            } else {
                const err = await res.text();
                showToast("⚠️ " + err);
            }
        } catch (err) {
            showToast("Error: " + err.message);
        }
    }

    function logout() {
        sessionStorage.removeItem('userId');
        userId = null;
        updateNavUser();
        showToast("Signed out");
    }

    updateNavUser();
</script>
</body>
</html>
