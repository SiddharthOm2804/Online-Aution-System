<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BidSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-box {
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            position: relative;
        }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="glass-card login-box">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width:54px; height:54px; font-size:1.6rem;">
                <i class="fas fa-gavel"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">Welcome to BidSphere</h3>
            <p class="text-secondary small mb-0">Sign in to list items, participate in auctions and manage your auto-bids</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">USERNAME / USER ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fas fa-user"></i></span>
                    <input type="text" id="userIdInput" class="form-control" placeholder="Enter your username (e.g. Alex, Buyer1)" required>
                </div>
            </div>

            <button type="submit" class="btn-glow w-100 justify-content-center py-3 mb-3">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-glass);">
            <a href="index.html" class="text-secondary small text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>

<script>
    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'notification-toast';
        toast.innerHTML = `<i class="fas fa-check-circle text-success"></i><span>${message}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('userIdInput').value.trim();
        if (!username) return;

        sessionStorage.setItem('userId', username);
        showToast(`Welcome back, ${username}! Redirecting...`);
        setTimeout(() => {
            window.location.href = 'auctions.html';
        }, 1200);
    }
</script>
</body>
</html>
